name: CI

# Phase 21 / Improvement #18 — DevEx.
# Сборка + тесты + сбор покрытия Coverlet для каждого PR и пуша в main.
# Раннер — ubuntu-latest: .NET Framework 4.8 проекты собираются Linux'ом
# через `Microsoft.NETFramework.ReferenceAssemblies` (UseWPF=true тоже
# работает благодаря Microsoft.WindowsDesktop.App.Ref). Полноценный
# end-to-end WPF UI требует Windows, но юнит-тесты по моделям, сервисам
# и ViewModel-ам успешно прогоняются под Linux.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # NuGet-кэш ускоряет повторные прогонки CI: пакеты ClosedXML / EF6 /
      # PdfPig / xunit лежат в ~/.nuget/packages и переиспользуются между
      # коммитами одной ветки, инвалидируясь по hash'у *.csproj.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore AhuErp.sln

      - name: Build (Release, no restore)
        run: dotnet build AhuErp.sln -c Release --no-restore /warnaserror

      # Coverlet через msbuild-таргет (а не DataCollector): на .NET
      # Framework 4.8 + Linux это более надёжный путь — `dotnet test`
      # без отдельного collector'а просто прогоняет xunit, а coverlet
      # инструментирует сборку через MSBuild-таргет перед запуском.
      # Migrations и сгенерированный EF-код исключаем по namespace,
      # чтобы автогенерация не накручивала проценты.
      - name: Test (Release, coverage)
        run: >
          dotnet test AhuErp.sln
          -c Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=$GITHUB_WORKSPACE/TestResults/coverage.cobertura.xml
          /p:Exclude="[AhuErp.Core]AhuErp.Core.Migrations.*"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          report=$(find TestResults -name 'coverage.cobertura.xml' | head -n 1)
          if [ -z "$report" ]; then
            echo "::warning ::coverage.cobertura.xml not found"
            exit 0
          fi
          # Извлекаем line-rate из корневого <coverage> тега Cobertura
          # и печатаем в виде «Coverage: 0.NN (NN%)». Парсить XML без
          # внешних утилит — sed/grep по `line-rate="..."`.
          rate=$(grep -oP 'line-rate="\K[0-9.]+' "$report" | head -n 1)
          if [ -z "$rate" ]; then
            echo "::warning ::line-rate not parsed from $report"
            exit 0
          fi
          pct=$(awk -v r="$rate" 'BEGIN { printf "%.1f", r * 100 }')
          echo "Coverage: $rate ($pct%)"
          echo "## Test coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Line rate: **$pct%** ($rate)" >> $GITHUB_STEP_SUMMARY
